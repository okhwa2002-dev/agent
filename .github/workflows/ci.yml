# CI: 빌드 + 전체 테스트(단위·통합·E2E — testcontainers가 Docker로 Mosquitto/PG/Redis 기동)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # Docker 내장 → testcontainers 동작
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
