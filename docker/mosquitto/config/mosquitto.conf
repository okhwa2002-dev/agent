# 로컬 개발용 Mosquitto 설정

# TCP MQTT (에이전트, mosquitto_pub/sub 용)
listener 1883
protocol mqtt

# WebSocket (브라우저 MQTT 클라이언트 용 — ws://localhost:9001)
listener 9001
protocol websockets

# 인증: 익명 차단 + 계정 파일 (기본 dev 계정 agent/agentmqttpw, device/devicemqttpw — 운영 배포 시 교체)
# 계정 추가/변경: docker run --rm -v ./docker/mosquitto/config:/cfg eclipse-mosquitto:2 mosquitto_passwd -b /cfg/passwd <user> <pw>
allow_anonymous false
password_file /mosquitto/config/passwd

# 인가(ACL): 단말은 자기 clientId 토픽에만 발행, 구독은 agent 계정만
acl_file /mosquitto/config/acl

# 입력 제한: 단말 메시지 최대 크기 (대형 payload로 버퍼/DB 부풀리기 방지)
message_size_limit 65536

# 폭주 흡수: 구독자(에이전트) 송신 큐/인플라이트 한도 상향
# 기본 max_queued_messages=1000 이면 순간 대량 발행 시 1000건 초과분을 브로커가 버린다(메시지 손실).
# 0 = 무제한. inflight 도 올려 broker→subscriber QoS1 처리량을 높인다(에이전트가 Redis 버퍼로 즉시 ack).
max_queued_messages 0
max_inflight_messages 1000

# 영속화 (재시작 시 QoS1 세션/메시지 보존)
persistence true
persistence_location /mosquitto/data/

# 로그
log_dest stdout
log_type all
