# 로컬 개발용 Mosquitto 설정

# TCP MQTT (에이전트, mosquitto_pub/sub 용)
listener 1883
protocol mqtt

# WebSocket (브라우저 MQTT 클라이언트 용 — ws://localhost:9001)
listener 9001
protocol websockets

allow_anonymous true

# 영속화 (재시작 시 QoS1 세션/메시지 보존)
persistence true
persistence_location /mosquitto/data/

# 로그
log_dest stdout
log_type all
